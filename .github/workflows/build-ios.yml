name: Build unsigned IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select older Xcode
        run: |
          ls /Applications | grep Xcode
          for v in 16.2 16.1 16.0 15.4 15.3 15.2; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              echo "Using Xcode $v"
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              xcodebuild -version
              exit 0
            fi
          done
          echo "No older Xcode found on this runner"
          exit 1

      - name: Download iOS platform
        run: sudo xcodebuild -downloadPlatform iOS

      - run: corepack enable

      - run: yarn install --no-immutable

      - name: Bundle JS
        run: |
          mkdir -p ios/bundle
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/bundle/main.jsbundle --assets-dest ios/bundle

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build (no signing)
        working-directory: ios
        shell: bash
        run: |
          xcodebuild archive \
            -workspace XStreaming.xcworkspace \
            -scheme XStreaming \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/app.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ios
        run: grep -n "error:" build.log | grep -v system_error | head -30

      - name: Package IPA
        working-directory: ios/build
        run: mkdir Payload && cp -r app.xcarchive/Products/Applications/*.app Payload/ && zip -r XStreaming.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: XStreaming-ipa
          path: ios/build/XStreaming.ipa
